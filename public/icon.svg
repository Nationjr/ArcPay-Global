<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Blue background -->
  <rect width="512" height="512" rx="90" fill="#4A8FD4"/>

  <!-- Outer circle of USDC logo -->
  <circle cx="256" cy="200" r="148" fill="none" stroke="white" stroke-width="14"/>

  <!-- Left bracket arc of USDC -->
  <path d="M 152 122 A 120 120 0 0 0 152 278"
    fill="none" stroke="white" stroke-width="22"
    stroke-linecap="round" stroke-dasharray="104 9999"/>

  <!-- Right bracket arc of USDC -->
  <path d="M 360 122 A 120 120 0 0 1 360 278"
    fill="none" stroke="white" stroke-width="22"
    stroke-linecap="round" stroke-dasharray="104 9999"/>

  <!-- Inner circle -->
  <circle cx="256" cy="200" r="76" fill="none" stroke="white" stroke-width="14"/>

  <!-- Dollar sign -->
  <text x="258" y="248"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="96" font-weight="bold"
    fill="white">$</text>

  <!-- ArcPay Global text -->
  <text x="256" y="430"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="54" font-weight="300"
    letter-spacing="1"
    fill="white">ArcPay Global</text>
</svg>
