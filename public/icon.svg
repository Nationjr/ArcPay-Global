<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#4A90D9"/>

  <!-- Outer circle -->
  <circle cx="256" cy="210" r="145" fill="none" stroke="white" stroke-width="12"/>

  <!-- Left arc bracket -->
  <path d="M 148 135 A 120 120 0 0 0 148 285" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-dasharray="90 999"/>

  <!-- Right arc bracket -->
  <path d="M 364 135 A 120 120 0 0 1 364 285" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-dasharray="90 999"/>

  <!-- Inner circle -->
  <circle cx="256" cy="210" r="72" fill="none" stroke="white" stroke-width="12"/>

  <!-- Dollar sign -->
  <text x="256" y="252" text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="88" font-weight="700"
    fill="white">$</text>

  <!-- ArcPay Global text -->
  <text x="256" y="420" text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="52" font-weight="400"
    fill="white">ArcPay Global</text>
</svg>
